schema_version = "1.0.0"

id = "mgs4_remastered_importer"
version = "1.0.0"
name = "MGS4 Remastered Importer"
tagline = "Import MGS4 models, rigs, materials, stages, and animations"
maintainer = "MGS4 Blender Importer contributors"
type = "add-on"

tags = ["Import-Export", "Animation"]
blender_version_min = "5.2.0"

license = [
  "SPDX:GPL-3.0-or-later",
]

[permissions]
files = "Read installed MGS4 assets and cache decoded textures"

[build]
paths_exclude_pattern = [
  "__pycache__/",
  "/.git/",
  "/*.zip",
]
